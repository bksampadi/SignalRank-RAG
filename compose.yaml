services:
  api:
    build: .
    command:
      uvicorn signalrank.api.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"

  ui:
    build: .
    command:
      streamlit run src/signalrank/ui/app.py
      --server.address=0.0.0.0
      --server.port=8501
    ports:
      - "8501:8501"
    environment:
      SIGNALRANK_API_URL: http://api:8000
    depends_on:
      - api