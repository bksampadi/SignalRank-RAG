services:
  api:
    build: .
    command:
      - uvicorn
      - signalrank.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      LOGFIRE_SERVICE_NAME: signalrank-api
      LOGFIRE_SERVICE_VERSION: 0.1.0

    healthcheck:
      test: [
              "CMD",
              "python",
              "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
            ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ui:
    build: .
    command:
      - streamlit
      - run
      - src/signalrank/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    environment:
      SIGNALRANK_API_URL: http://api:8000
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      LOGFIRE_SERVICE_NAME: signalrank-ui
      LOGFIRE_SERVICE_VERSION: 0.1.0
    depends_on:
      api:
        condition: service_healthy