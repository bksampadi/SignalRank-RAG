services:
  api:
    build: .
    command:
      uvicorn signalrank.api.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    environment:
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      LOGFIRE_SERVICE_NAME: signalrank-api
      LOGFIRE_SERVICE_VERSION: 0.1.0

  ui:
    build: .
    command:
      streamlit run src/signalrank/ui/app.py
      --server.address=0.0.0.0
      --server.port=8501
    ports:
      - "8501:8501"
    environment:
      SIGNALRANK_API_URL: http://api:8000
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      LOGFIRE_SERVICE_NAME: signalrank-ui
      LOGFIRE_SERVICE_VERSION: 0.1.0
    depends_on:
      - api