[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "signalrank-rag"
version = "0.2.0"
description = "A signal-aware retrieval and ranking system"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Configuration
    "PyYAML>=6.0,<7",
    "python-box>=7.4,<8",
    # Observability
    "logfire[fastapi,requests]>=4.40,<5",
    # Data ingestion
    "pymupdf",
    "beautifulsoup4>=4.15.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "unstructured[docx,pptx,xlsx]>=0.22.18",
    "datasets>=5.0.1",
    # Retrieval
    "bm25s>=0.3.10,<0.4",
    "sentence-transformers>=5.7,<6",
    "torch",
    # Vector store
    "qdrant-client>=1.19,<2",
    # Cloud embeddings
    "langchain-google-genai>=4.3.4",
    "google-generativeai>=0.8.6",
    # Agents / orchestration
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    # API / UI
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "streamlit>=1.61.1",
    "requests>=2.34.2",
    "flashrank>=0.2.10,<0.3",
    "langchain-openrouter>=0.2.8",
]


[project.optional-dependencies]
eval = [
    "pandas>=3,<4",
]


[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "notebook",
    "httpx2>=2.10.0",
    "ruff>=0.16.4",
    "pyright>=1.1.411",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.logfire]
service_name = "signalrank-rag"
environment = "development"


[tool.ruff]
target-version = "py311"


[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
