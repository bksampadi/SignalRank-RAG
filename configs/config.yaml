data_ingestion:
  source_path: data/
  recursive: true
  encoding: utf-8
  supported_extensions:
    - .pdf
    - .txt
    - .md
    - .markdown
    - .html
    - .htm
    - .docx
    - .pptx
    - .xlsx

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2

chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  top_k: 5

qdrant:
  collection_name: signalrank_finewiki
  path: data/qdrant

logfire:
  service_name: signalrank-rag
  environment: local
  system_metrics: false

finewiki:
  language: enwiki
  batch_size: 256