data_ingestion:
  source_path: data/
  recursive: true
  encoding: utf-8
  supported_extensions:
    - .pdf
    - .txt
    - .md
    - .markdown
    - .html
    - .htm
    - .docx
    - .pptx
    - .xlsx

embedding:
  provider: sentence_transformer
  model_name: sentence-transformers/all-mpnet-base-v2

chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  top_k: 5
  rrf_k: 60
  candidate_multiplier: 4

ranking:
  enabled: true
  provider: flashrank
  model_name: ms-marco-MiniLM-L-12-v2
  max_length: 512
  candidate_multiplier: 4

qdrant:
  mode: local
  collection_name: signalrank_finewiki
  recreate_collection: true
  path: data/qdrant/dev

logfire:
  service_name: signalrank-rag
  environment: local
  system_metrics: false

finewiki:
  language: enwiki
  batch_size: 256