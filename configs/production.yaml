data_ingestion:
  source_path: benchmarks/retrieval/corpus
  recursive: true
  encoding: utf-8
  supported_extensions:
    - .pdf
    - .txt
    - .md
    - .markdown
    - .html
    - .htm
    - .docx
    - .pptx
    - .xlsx

embedding:
  provider: sentence_transformer
  model_name: sentence-transformers/all-mpnet-base-v2

chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  top_k: 5
  rrf_k: 60
  candidate_multiplier: 4

qdrant:
  mode: remote
  collection_name: signalrank_demo
  path: null

logfire:
  service_name: signalrank-rag
  environment: production
  system_metrics: false

finewiki:
  language: enwiki
  batch_size: 256