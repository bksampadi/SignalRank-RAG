name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Code quality
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Lint
              run: uv run --locked ruff check .

            - name: Check formatting
              run: uv run --locked ruff format --check .

    typecheck:
        name: Static typing
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Type check
              run: uv run --locked pyright

    test:
        name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: "3.11"
                    - os: ubuntu-latest
                      python-version: "3.12"
                    - os: ubuntu-latest
                      python-version: "3.13"
                    - os: windows-latest
                      python-version: "3.11"
                    - os: windows-latest
                      python-version: "3.12"
                    - os: windows-latest
                      python-version: "3.13"

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Run tests
              run: uv run --locked python -m pytest -v

    docker:
        name: Docker smoke test
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: signalrank-rag:test
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Create smoke-test corpus
              run:  |
                  mkdir -p .ci-data
                  printf '%s\n' \
                    'Mars rovers explore the surface of the red planet.'  \
                    'Retrieval systems rank relevant evidence for user queries.' \
                    > .ci-data/smoke.txt
            
            - name: Verify smoke-text corpus
              run:  |
                  test -s .ci-data/smoke.txt
                  cat .ci-data/smoke.txt

            - name: Index smoke-test corpus
              run: |
                  docker run --rm \
                    -e LOGFIRE_IGNORE_NO_CONFIG=1 \
                    -v "${{ github.workspace }}/.ci-data:/app/data" \
                    signalrank-rag:test \
                    python -c "from signalrank.pipelines.indexing_pipeline import IndexingPipeline; IndexingPipeline().run()"

            - name: Start API container
              run:  |
                  docker run -d \
                    --name signalrank-rag \
                    -p 8000:8000 \
                    -e LOGFIRE_IGNORE_TO_CONFIG=1 \
                    -v "${{ github.workspace }}/.ci-data:/app/data" \
                    signalrank-rag:test

            - name: Wait for API health
              run:  |
                  for i in {1..90}; do
                    if curl --fail --silent http://localhost:8000/health; then
                      echo
                      echo "SignalRank API is healthy"
                      exit 0
                    fi

                    echo "Waiting for API..."
                    sleep 5
                  done

                  echo "API failed to become healthy"
                  docker logs signalrank-rag
                  exit 1

            - name: Test BM25 retrieval
              run:  |
                  curl --fail --silent --show-error \
                    -X POST http://localhost:8000/retrieve \
                    -H "Content-Type: application/json" \
                    -d '{"query":"Mars rover","mode":"bm25","top_k":2}'

            - name: Test dense retrieval
              run:  |
                  curl --fail --silent --show-error \
                    -X POST http://localhost:8000/retrieve \
                    -H "Content-Type: application/json" \
                    -d '{"query":"Mars rover","mode":"dense","top_k":2}'

            - name: Show container logs on failure
              if: failure()
              run: docker logs signalrank-rag 2>/dev/null || true

            - name: Stop container
              if: always()
              run: docker rm -f signalrank-rag 2>/dev/null || true

