name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Code quality
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Lint
              run: uv run --locked ruff check .

            - name: Check formatting
              run: uv run --locked ruff format --check .

    typecheck:
        name: Static typing
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Type check
              run: uv run --locked pyright

    test:
        name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: "3.11"
                    - os: ubuntu-latest
                      python-version: "3.12"
                    - os: ubuntu-latest
                      python-version: "3.13"
                    - os: windows-latest
                      python-version: "3.11"
                    - os: windows-latest
                      python-version: "3.12"
                    - os: windows-latest
                      python-version: "3.13"

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Run tests
              run: uv run --locked python -m pytest -v

    docker:
        name: Docker smoke test
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: signalrank-rag:test
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Create smoke-test corpus
              run:  |
                  mkdir -p .ci-data
                  printf '%s\n' \
                    'Mars rovers explore the surface of the red planet.'  \
                    'Retrieval systems rank relevant evidence for user queries.' \
                    > .ci-data/smoke.txt
            
            - name: Verify smoke-text corpus
              run:  |
                  test -s .ci-data/smoke.txt
                  cat .ci-data/smoke.txt

            - name: Index smoke-test corpus
              run: |
                  docker run --rm \
                    -e LOGFIRE_IGNORE_NO_CONFIG=1 \
                    -v "${{ github.workspace }}/.ci-data:/app/data" \
                    signalrank-rag:test \
                    python -c "from signalrank.pipelines.indexing_pipeline import IndexingPipeline; IndexingPipeline().run()"

            - name: Generate smoke-test service token
              shell: bash
              run: |
                  TOKEN="$(openssl rand -hex 32)"
                  echo "::add-mask::$TOKEN"
                  echo "SIGNALRANK_SERVICE_TOKEN=$TOKEN" >> "$GITHUB_ENV"


            - name: Start API container
              run: |
                  docker run -d \
                    --name signalrank-rag \
                    -p 8000:8000 \
                    -e LOGFIRE_IGNORE_NO_CONFIG=1 \
                    -e SIGNALRANK_SERVICE_TOKEN \
                    -v "${{ github.workspace }}/.ci-data:/app/data" \
                    signalrank-rag:test

            - name: Wait for API health
              run:  |
                  for i in {1..90}; do
                    if curl --fail --silent http://localhost:8000/health; then
                      echo
                      echo "SignalRank API is healthy"
                      exit 0
                    fi

                    echo "Waiting for API..."
                    sleep 5
                  done

                  echo "API failed to become healthy"
                  docker logs signalrank-rag
                  exit 1

            - name: Test BM25 retrieval
              run:  |
                  curl --fail --silent --show-error \
                    -X POST http://localhost:8000/retrieve \
                    -H "Content-Type: application/json" \
                    -H "X-SignalRank-Service-Token: ${SIGNALRANK_SERVICE_TOKEN}" \
                    -d '{"query":"Mars rover","mode":"bm25","top_k":2}'

            - name: Test dense retrieval
              run:  |
                  curl --fail --silent --show-error \
                    -X POST http://localhost:8000/retrieve \
                    -H "Content-Type: application/json" \
                    -H "X-SignalRank-Service-Token: ${SIGNALRANK_SERVICE_TOKEN}" \
                    -d '{"query":"Mars rover","mode":"dense","top_k":2}'

            - name: Show container logs on failure
              if: failure()
              run: docker logs signalrank-rag 2>/dev/null || true

            - name: Stop container
              if: always()
              run: docker rm -f signalrank-rag 2>/dev/null || true

    publish:
        name: Publish container image
        needs:
            - quality
            - typecheck
            - test
            - docker

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/bksampadi/signalrank-rag:${{ github.sha }}
                      ghcr.io/bksampadi/signalrank-rag:latest
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy to Azure
        needs:
            - publish

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        runs-on: ubuntu-latest
        timeout-minutes: 15

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Azure login
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Deploy API
              run: |
                  az containerapp update \
                    --name signalrank-api \
                    --resource-group signalrank-prod-rg \
                    --image ghcr.io/bksampadi/signalrank-rag:${{ github.sha }}

            - name: Deploy UI
              run: |
                  az containerapp update \
                    --name signalrank-ui \
                    --resource-group signalrank-prod-rg \
                    --image ghcr.io/bksampadi/signalrank-rag:${{ github.sha }}

            - name: Verify deployed images
              run: |
                  API_IMAGE=$(az containerapp show \
                    --name signalrank-api \
                    --resource-group signalrank-prod-rg \
                    --query "properties.template.containers[0].image" \
                    --output tsv)

                  UI_IMAGE=$(az containerapp show \
                    --name signalrank-ui \
                    --resource-group signalrank-prod-rg \
                    --query "properties.template.containers[0].image" \
                    --output tsv)

                  EXPECTED="ghcr.io/bksampadi/signalrank-rag:${{ github.sha }}"

                  echo "Expected: $EXPECTED"
                  echo "API:      $API_IMAGE"
                  echo "UI:       $UI_IMAGE"

                  test "$API_IMAGE" = "$EXPECTED"
                  test "$UI_IMAGE" = "$EXPECTED"

            - name: Verify public UI
              run: |
                  for i in {1..30}; do
                    if curl --fail --silent --show-error \
                      https://signalrank-ui.icybeach-127c89e3.northeurope.azurecontainerapps.io/ \
                      > /dev/null; then
                      echo "SignalRank UI is reachable"
                      exit 0
                    fi

                    echo "Waiting for deployed UI..."
                    sleep 10
                  done

                  echo "Production UI failed to become reachable"
                  exit 1

