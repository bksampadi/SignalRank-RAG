name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: "3.11"
                    - os: ubuntu-latest
                      python-version: "3.12"
                    - os: ubuntu-latest
                      python-version: "3.13"
                    - os: ubuntu-latest
                      python-version: "3.14"
                    - os: windows-latest
                      python-version: "3.11"
                    - os: windows-latest
                      python-version: "3.12"
                    - os: windows-latest
                      python-version: "3.13"
                    - os: windows-latest
                      python-version: "3.14"

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                python-version: ${{ matrix.python-version }}
                enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Run tests
              run: uv run --locked python -m pytest -v