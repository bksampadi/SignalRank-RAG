name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Code quality
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Lint
              run: uv run --locked ruff check .

            - name: Check formatting
              run: uv run --locked ruff format --check .

    typecheck:
        name: Static typing
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Type check
              run: uv run --locked pyright

    test:
        name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: "3.11"
                    - os: ubuntu-latest
                      python-version: "3.12"
                    - os: ubuntu-latest
                      python-version: "3.13"
                    - os: windows-latest
                      python-version: "3.11"
                    - os: windows-latest
                      python-version: "3.12"
                    - os: windows-latest
                      python-version: "3.13"

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install uv and Python
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: Install project
              run: uv sync --locked --dev

            - name: Run tests
              run: uv run --locked python -m pytest -v

    docker:
        name: Docker smoke test
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Setup up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: signalrank-rag:test
                  cache-from: type=gha
                  cache-to: type=gha, mode=max

            - name: Start container
              run:  |
                  docker run -d \
                    --name signalrank-rag \
                    -p 8000:8000 \
                    signalrank-rag:test

            - name: Wait for API health
              run:  |
                  for i in {1..30}; do
                    if curl --fail --silent http://localhost:8000/health; then
                      echo "SignalRank API is healthy"
                      exit 0
                    fi

                    echo "Waiting for API..."
                    sleep 5
                  done

                  echo "API failed to become healthy"
                  docker logs signalrank-rag
                  exit 1

            - name: Show container logs on failure
              if: failure()
              run: docker logs signalrank-rag

            - name: Stop container
              if: always()
              run: docker rm -f signalrank-rag

